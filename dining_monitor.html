<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Dining Philosophers - Monitor</title>
<style>
body{font-family:Arial;background:#eef2f7;color:#183153;padding:20px}
.card{background:white;padding:18px;margin:12px 0;border-radius:12px}
button{padding:10px;margin:4px;background:#1769aa;color:white;border:0;cursor:pointer}
table{width:100%;border-collapse:collapse}
td,th{border:1px solid #ccc;padding:8px;text-align:left}
svg{width:100%;max-width:450px;display:block;margin:auto}
</style>
</head>
<body>
<h1>Dining Philosophers - Monitor Solution</h1>
<div class="card">
<h2 id="message">Press Play to start</h2>
<p id="counter">Event 0</p>
<p id="states"></p>
<button onclick="play()">Play</button>
<button onclick="pause()">Pause</button>
<button onclick="next()">Next Event</button>
<button onclick="reset()">Reset</button>
<div style="background:#ddd;height:10px"><div id="progress" style="background:#1769aa;height:10px;width:0%"></div></div>
</div>
<div class="card">
<h2>Table Visualization</h2>
<svg viewBox="0 0 400 400">
<circle cx="200" cy="200" r="95" fill="#f5e5c8" stroke="#c6a56b" stroke-width="3"/>
<g id="sticks"></g><g id="people"></g>
</svg>
</div>
<div class="card">
<h2>Execution Log</h2>
<table><thead><tr><th>Time</th><th>Philosopher</th><th>Event</th></tr></thead>
<tbody id="logs"></tbody></table>
</div>
<script>
const events=[{"time": 0.002, "philosopher": 3, "action": "thinking", "message": "Philosopher 4 is thinking", "states": ["Thinking", "Thinking", "Thinking", "Thinking"]}, {"time": 0.054, "philosopher": 0, "action": "thinking", "message": "Philosopher 1 is thinking", "states": ["Thinking", "Thinking", "Thinking", "Thinking"]}, {"time": 0.105, "philosopher": 2, "action": "thinking", "message": "Philosopher 3 is thinking", "states": ["Thinking", "Thinking", "Thinking", "Thinking"]}, {"time": 0.156, "philosopher": 1, "action": "thinking", "message": "Philosopher 2 is thinking", "states": ["Thinking", "Thinking", "Thinking", "Thinking"]}, {"time": 0.47, "philosopher": 3, "action": "hungry", "message": "Philosopher 4 is hungry", "states": ["Thinking", "Thinking", "Thinking", "Hungry"]}, {"time": 0.47, "philosopher": 3, "action": "eating", "message": "Philosopher 4 is eating", "states": ["Thinking", "Thinking", "Thinking", "Eating"]}, {"time": 0.542, "philosopher": 1, "action": "hungry", "message": "Philosopher 2 is hungry", "states": ["Thinking", "Hungry", "Thinking", "Eating"]}, {"time": 0.542, "philosopher": 1, "action": "eating", "message": "Philosopher 2 is eating", "states": ["Thinking", "Eating", "Thinking", "Eating"]}, {"time": 0.654, "philosopher": 2, "action": "hungry", "message": "Philosopher 3 is hungry", "states": ["Thinking", "Eating", "Hungry", "Eating"]}, {"time": 0.753, "philosopher": 0, "action": "hungry", "message": "Philosopher 1 is hungry", "states": ["Hungry", "Eating", "Hungry", "Eating"]}, {"time": 0.94, "philosopher": 1, "action": "finished", "message": "Philosopher 2 finished eating and released chopsticks", "states": ["Hungry", "Thinking", "Hungry", "Eating"]}, {"time": 0.94, "philosopher": 1, "action": "thinking", "message": "Philosopher 2 is thinking", "states": ["Hungry", "Thinking", "Hungry", "Eating"]}, {"time": 0.945, "philosopher": 3, "action": "finished", "message": "Philosopher 4 finished eating and released chopsticks", "states": ["Hungry", "Thinking", "Hungry", "Thinking"]}, {"time": 0.945, "philosopher": 3, "action": "thinking", "message": "Philosopher 4 is thinking", "states": ["Hungry", "Thinking", "Hungry", "Thinking"]}, {"time": 0.945, "philosopher": 0, "action": "eating", "message": "Philosopher 1 is eating", "states": ["Eating", "Thinking", "Hungry", "Thinking"]}, {"time": 0.945, "philosopher": 2, "action": "eating", "message": "Philosopher 3 is eating", "states": ["Eating", "Thinking", "Eating", "Thinking"]}, {"time": 1.278, "philosopher": 0, "action": "finished", "message": "Philosopher 1 finished eating and released chopsticks", "states": ["Thinking", "Thinking", "Eating", "Thinking"]}, {"time": 1.278, "philosopher": 0, "action": "thinking", "message": "Philosopher 1 is thinking", "states": ["Thinking", "Thinking", "Eating", "Thinking"]}, {"time": 1.472, "philosopher": 1, "action": "hungry", "message": "Philosopher 2 is hungry", "states": ["Thinking", "Hungry", "Eating", "Thinking"]}, {"time": 1.493, "philosopher": 2, "action": "finished", "message": "Philosopher 3 finished eating and released chopsticks", "states": ["Thinking", "Hungry", "Thinking", "Thinking"]}, {"time": 1.493, "philosopher": 2, "action": "thinking", "message": "Philosopher 3 is thinking", "states": ["Thinking", "Hungry", "Thinking", "Thinking"]}, {"time": 1.493, "philosopher": 1, "action": "eating", "message": "Philosopher 2 is eating", "states": ["Thinking", "Eating", "Thinking", "Thinking"]}, {"time": 1.589, "philosopher": 3, "action": "hungry", "message": "Philosopher 4 is hungry", "states": ["Thinking", "Eating", "Thinking", "Hungry"]}, {"time": 1.589, "philosopher": 3, "action": "eating", "message": "Philosopher 4 is eating", "states": ["Thinking", "Eating", "Thinking", "Eating"]}, {"time": 1.915, "philosopher": 0, "action": "hungry", "message": "Philosopher 1 is hungry", "states": ["Hungry", "Eating", "Thinking", "Eating"]}, {"time": 1.976, "philosopher": 2, "action": "hungry", "message": "Philosopher 3 is hungry", "states": ["Hungry", "Eating", "Hungry", "Eating"]}, {"time": 2.024, "philosopher": 1, "action": "finished", "message": "Philosopher 2 finished eating and released chopsticks", "states": ["Hungry", "Thinking", "Hungry", "Eating"]}, {"time": 2.128, "philosopher": 3, "action": "finished", "message": "Philosopher 4 finished eating and released chopsticks", "states": ["Hungry", "Thinking", "Hungry", "Thinking"]}, {"time": 2.128, "philosopher": 2, "action": "eating", "message": "Philosopher 3 is eating", "states": ["Hungry", "Thinking", "Eating", "Thinking"]}, {"time": 2.129, "philosopher": 0, "action": "eating", "message": "Philosopher 1 is eating", "states": ["Eating", "Thinking", "Eating", "Thinking"]}, {"time": 2.488, "philosopher": 0, "action": "finished", "message": "Philosopher 1 finished eating and released chopsticks", "states": ["Thinking", "Thinking", "Eating", "Thinking"]}, {"time": 2.649, "philosopher": 2, "action": "finished", "message": "Philosopher 3 finished eating and released chopsticks", "states": ["Thinking", "Thinking", "Thinking", "Thinking"]}];
const positions=[[200,65],[335,200],[200,335],[65,200]];
const stickPositions=[[270,120],[280,270],[120,280],[120,120]];
let index=0,timer=null;

function draw(states){
 document.getElementById("people").innerHTML=states.map((s,i)=>{
  let [x,y]=positions[i];
  let c=s==="Eating"?"#39a96b":s==="Hungry"?"#efb447":"#528fd1";
  return `<g><circle cx="${x}" cy="${y}" r="30" fill="${c}" stroke="#183153" stroke-width="2"/><text x="${x}" y="${y-2}" text-anchor="middle" font-size="12" fill="white">P${i+1}</text><text x="${x}" y="${y+12}" text-anchor="middle" font-size="9" fill="white">${s}</text></g>`;
 }).join("");
 document.getElementById("sticks").innerHTML=stickPositions.map(([x,y],i)=>
 `<g><rect x="${x-5}" y="${y-16}" width="10" height="32" rx="3" fill="#a87945" transform="rotate(45 ${x} ${y})"/><text x="${x}" y="${y+25}" text-anchor="middle" font-size="10">C${i+1}</text></g>`
 ).join("");
 document.getElementById("states").textContent=states.map((s,i)=>`P${i+1}: ${s}`).join(" | ");
}
function show(){
 if(index>=events.length){pause();return}
 let e=events[index++];
 document.getElementById("message").textContent=e.message;
 document.getElementById("counter").textContent=`Event ${index}/${events.length} · ${e.time}s`;
 draw(e.states);
 document.getElementById("progress").style.width=(index/events.length*100)+"%";
 let row=document.createElement("tr");
 [e.time,"Philosopher "+(e.philosopher+1),e.message].forEach(v=>{let td=document.createElement("td");td.textContent=v;row.appendChild(td)});
 document.getElementById("logs").appendChild(row);
}
function play(){if(timer===null&&index<events.length)timer=setInterval(show,700)}
function pause(){clearInterval(timer);timer=null}
function next(){pause();show()}
function reset(){pause();index=0;document.getElementById("logs").innerHTML="";document.getElementById("message").textContent="Press Play to start";document.getElementById("counter").textContent="Event 0";document.getElementById("progress").style.width="0%";draw(["Thinking","Thinking","Thinking","Thinking"])}
draw(["Thinking","Thinking","Thinking","Thinking"]);
</script>
</body>
</html>
